name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "scripts/check-docs.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "scripts/check-docs.mjs"
      - ".github/workflows/docs.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check documentation links and structure
        run: node scripts/check-docs.mjs
