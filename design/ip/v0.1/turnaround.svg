    <use href="#sideFigure" transform="translate(1182 218) scale(.84)"/>
    <use href="#backFigure" transform="translate(1742 218) scale(.84)"/>

    <!-- 底部规范区 -->
    <line x1="70" y1="1182" x2="2330" y2="1182" stroke="#20262B" stroke-opacity=".12"/>
    <text x="70" y="1230" fill="#20262B" font-size="22" font-weight="700">角色锚点</text>
    <text x="70" y="1270" fill="#626A6D" font-size="18">约 3.2 头身（含耳）· 豆形躯干 · 短腿 · 四指手 · 猪鼻始终位于面部中心</text>
    <text x="70" y="1303" fill="#626A6D" font-size="18">任务马甲使用奶油白；腰带和鞋底用墨色压住轮廓；薄荷绿只表达任务节点与信号。</text>

    <text x="1100" y="1230" fill="#20262B" font-size="22" font-weight="700">产品变体规则</text>
    <text x="1100" y="1270" fill="#626A6D" font-size="18">允许换装：围裙、耳机、地图夹板、乐器、手持工具</text>
    <text x="1100" y="1303" fill="#626A6D" font-size="18">不可改变：头部轮廓、五官间距、肤色、身体比例、尾巴信号灯</text>

    <text x="1880" y="1230" fill="#20262B" font-size="22" font-weight="700">主色</text>
    <rect x="1880" y="1250" width="76" height="48" rx="13" fill="#E89A96"/>
    <rect x="1968" y="1250" width="76" height="48" rx="13" fill="#FFF9EF" stroke="#20262B" stroke-opacity=".18"/>
    <rect x="2056" y="1250" width="76" height="48" rx="13" fill="#20262B"/>
    <rect x="2144" y="1250" width="76" height="48" rx="13" fill="#64DDC3"/>
    <text x="1882" y="1324" fill="#626A6D" font-size="14">Blush</text>
    <text x="1970" y="1324" fill="#626A6D" font-size="14">Bone</text>
    <text x="2058" y="1324" fill="#626A6D" font-size="14">Ink</text>
    <text x="2146" y="1324" fill="#626A6D" font-size="14">Signal</text>

    <rect x="70" y="1370" width="2260" height="72" rx="20" fill="#20262B"/>
    <text x="100" y="1415" fill="#FFF9EF" font-size="18">评审重点：头身比例是否足够像“搭手”；手部是否需要更拟人；任务马甲是否过重；产品换装应保持多少主色。</text>
    <text x="2210" y="1415" fill="#64DDC3" font-size="16" font-weight="700">v0.1</text>
