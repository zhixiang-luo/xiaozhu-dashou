    <text x="102" y="198" fill="#A75258" font-size="18" font-weight="700" letter-spacing="2">01 / 标准正面</text>
    <text x="652" y="198" fill="#0B695D" font-size="18" font-weight="700" letter-spacing="2">02 / 四分之三</text>
    <text x="1202" y="198" fill="#0B695D" font-size="18" font-weight="700" letter-spacing="2">03 / 标准侧面</text>
    <text x="1752" y="198" fill="#0B695D" font-size="18" font-weight="700" letter-spacing="2">04 / 标准背面</text>

