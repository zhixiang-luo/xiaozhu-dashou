  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="70" y="76" fill="#20262B" font-size="46" font-weight="700" letter-spacing="3">猪哥 · IP Bible v0.1</text>
    <text x="72" y="116" fill="#626A6D" font-size="19" letter-spacing="1.5">一个母版角色，不同产品只换装和道具</text>
    <rect x="1932" y="54" width="398" height="50" rx="25" fill="#FFF9EF" stroke="#20262B" stroke-opacity=".12"/>
    <circle cx="1964" cy="79" r="7" fill="#64DDC3"/>
    <text x="1986" y="86" fill="#20262B" font-size="17" font-weight="600">概念评审稿 · 尚未进入 3D 生产</text>

