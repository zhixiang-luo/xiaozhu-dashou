id: calendar.list-events
version: 0.1.0
displayName: 查询系统日历日程
appPackages:
  - com.android.providers.calendar
supportedVersions:
  - Android 11+
prerequisites:
  - calendar.permission_granted
capabilities:
  - system_provider
risk:
  sideEffect: read
inputs:
  rangeStart:
    type: text
    required: true
    description: 带时区的 ISO 8601 查询开始时间
  rangeEnd:
    type: text
    required: true
    description: 带时区的 ISO 8601 查询结束时间
  titleQuery:
    type: text
    required: false
    description: 可选的日程标题过滤词
verification:
  - calendar_events_read
steps:
  - id: list-events
    action: list_calendar_events
    rangeStartKey: rangeStart
    rangeEndKey: rangeEnd
    titleQueryKey: titleQuery
